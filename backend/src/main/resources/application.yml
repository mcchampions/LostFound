spring:
  datasource:
    # 常用变量：默认值可直接运行，部署时通过 backend/app/.env 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lost_found}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    # 常用变量：部署时通过 backend/app/.env 覆盖
    host: ${MAIL_HOST}
    # 非常用变量：一般无需修改，默认 465（SSL）
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.ssl.enable": true
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
  servlet:
    multipart:
      # 非常用变量：默认 5MB / 25MB
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  # 非常用变量：默认 8080
  port: ${SERVER_PORT:8080}
  # 真实客户端 IP 还原：
  # - 默认 native + 空信任列表 = 不解析 X-Forwarded-For，直接使用连接方 IP（jar 直连安全）；
  # - 分拆部署（前端机反向代理）时，设置 FORWARDED_TRUSTED_PROXIES 为前端机 IP
  #   即可还原真实客户端 IP；同机部署填 127.0.0.1。
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 置空 Tomcat 默认私网段信任，避免校园网内直连客户端伪造 XFF
      internal-proxies: ""
      trusted-proxies: ${FORWARDED_TRUSTED_PROXIES:}

app:
  site:
    # 常用变量：邮件跳转链接使用的前端公开地址（部署时通过 backend/app/.env 覆盖）
    base-url: ${SITE_BASE_URL:http://localhost:5173}
  jwt:
    # 常用变量：JWT 密钥必须替换为强随机值
    secret: ${JWT_SECRET:lostfound-2026-jwt-secret}
    # 非常用变量：token 有效期，默认 24 小时
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    auth-cookie:
      # Cookie 不可被脚本读取；跨站 HTTPS 部署时设置 SECURE=true、SameSite=None
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  upload:
    # 常用变量：上传根目录（相对启动目录或绝对路径）
    path: ${APP_UPLOAD_PATH:./uploads}
  cors:
    # 常用变量：允许的前端来源，逗号分隔（部署时通过 backend/app/.env 覆盖）
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  postgen:
    # 常用变量：文字封面生成服务（部署时通过 backend/app/.env 覆盖）
    enabled: ${POSTGEN_ENABLED:true}
    base-url: ${POSTGEN_BASE_URL:http://localhost:3000}
    rate-limit-per-minute: ${POSTGEN_RATE_LIMIT:10}
  mail:
    # 非常用变量：离线未读摘要邮件发送间隔 / 已提醒状态清空间隔
    digest-interval-ms: ${MAIL_DIGEST_INTERVAL_MS:180000}
    state-clear-interval-ms: ${MAIL_STATE_CLEAR_INTERVAL_MS:86400000}
    # 非常用变量：邮件失败重试（最大次数 / 退避秒数 / 重试周期毫秒）
    retry-max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:5}
    retry-backoff-seconds: ${MAIL_RETRY_BACKOFF_SECONDS:60}
    retry-interval-ms: ${MAIL_RETRY_INTERVAL_MS:300000}
    retry-queue-capacity: ${MAIL_RETRY_QUEUE_CAPACITY:10000}
    retry-batch-size: ${MAIL_RETRY_BATCH_SIZE:100}
  audit:
    # 非常用变量：操作日志保留天数，过期自动清理
    log-retention-days: ${LOG_RETENTION_DAYS:365}
    login:
      # 非常用变量：登录防爆破阈值，一般无需修改
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
      ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
      ip-window-minutes: ${LOGIN_IP_WINDOW_MINUTES:10}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 非常用变量：SQL 默认不直接打印到 stdout；需要时用 MYBATIS_LOG_IMPL 覆盖
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      id-type: auto
      # 表前缀，形如 "prefix_"，默认为空
      table-prefix: ${TABLE_PREFIX:}

logging:
  level:
    root: info
    # 非常用变量：业务包默认 info；本地调试可 LOG_LEVEL_APP=debug
    "me.qscbm.projects.lostfound": ${LOG_LEVEL_APP:info}
    # 非常用变量：SQL 默认关闭；本地调试可 LOG_LEVEL_SQL=debug
    "me.qscbm.projects.lostfound.mapper": ${LOG_LEVEL_SQL:off}
