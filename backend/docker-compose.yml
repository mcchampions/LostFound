services:
  postgen:
    build: ./postgen-service

  backend:
    build: .
    # 前后端分机部署：必须发布 8080 供前端机 Nginx 反代。
    # 建议宿主机防火墙只放行前端机器的 IP。
    ports:
      - "8080:8080"
    environment:
      DB_HOST: host.docker.internal
      DB_PASSWORD: your_db_password
      MAIL_HOST: your_smtp_host
      MAIL_PORT: "465"
      MAIL_USERNAME: your_email
      MAIL_PASSWORD: your_mail_password
      MAIL_DIGEST_INTERVAL_MS: "180000"
      MAIL_STATE_CLEAR_INTERVAL_MS: "86400000"
      JWT_SECRET: your_jwt_secret
      APP_CORS_ALLOWED_ORIGINS: http://your_frontend_host:5173
      SITE_BASE_URL: http://your_frontend_host:5173
      APP_UPLOAD_PATH: /app/uploads
      POSTGEN_ENABLED: "true"
      POSTGEN_BASE_URL: http://postgen:3000
      POSTGEN_RATE_LIMIT: "10"
      # 还原真实客户端 IP：填前端 Nginx 所在机器的 IP（必改）。
      # 注意：若本机 Docker 端口映射走 userland-proxy，容器看到的是网关 IP 而非
      # 前端机 IP，此时可改为留空（不信任任何代理）或在宿主机关闭 userland-proxy。
      FORWARD_HEADERS_STRATEGY: native
      FORWARDED_TRUSTED_PROXIES: your_frontend_ip
    depends_on:
      - postgen
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
      - ./logs:/app/logs
