services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: host.docker.internal
      DB_PASSWORD: your_db_password
      MAIL_HOST: your_smtp_host
      MAIL_USERNAME: your_email
      MAIL_PASSWORD: your_mail_password
      JWT_SECRET: your_jwt_secret
      APP_CORS_ALLOWED_ORIGINS: http://your_frontend_host:5173
      POSTGEN_ENABLED: "true"
      POSTGEN_NODE_BIN: node
      POSTGEN_CLI_PATH: /app/postgen/dist/cli.js
      POSTGEN_FONT_REGULAR: /app/postgen/fonts/custom/LXGWWenKaiLite-Regular.ttf
      POSTGEN_FONT_BOLD: /app/postgen/fonts/custom/LXGWMarkerGothic-Regular.ttf
      POSTGEN_RATE_LIMIT: "10"
    volumes:
      - ../uploads:/app/uploads
