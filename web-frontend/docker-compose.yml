services:
  frontend:
    build:
      context: .
      args:
        # 同源部署：浏览器经本 Nginx 访问 /api、/uploads、/ws
        VITE_SERVER_BASE: ""
        # 后端上游（必改）：填后端机器地址，如 http://192.168.1.10:8080
        # 不能填只在后端机器内部可解析的容器名
        BACKEND_UPSTREAM: http://your-backend-host:8080
    ports:
      - "5173:80"
