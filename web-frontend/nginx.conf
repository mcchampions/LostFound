# 默认 Docker 部署（方案 A）：本 Nginx 是唯一对外入口，同源反代
# /api、/uploads、/ws 到后端，后端端口不发布到宿主机。
#
# __BACKEND_UPSTREAM__ 由 Dockerfile 构建参数 BACKEND_UPSTREAM 替换，
# 分拆部署时填后端机器地址（如 http://192.168.1.10:8080）。
# 若手动把本文件复制到其他 Nginx，请先把 __BACKEND_UPSTREAM__ 换成真实后端地址。

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 1000;

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 上传/API 请求体上限需与后端 MAX_REQUEST_SIZE（默认 25MB）一致
    client_max_body_size 25m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代
    location /api/ {
        proxy_pass __BACKEND_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传图片/封面文件反代
    location /uploads/ {
        proxy_pass __BACKEND_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket(SockJS) 反代：命中 /ws 及 /ws/info、/ws/{session}/* 等路径
    location /ws {
        proxy_pass __BACKEND_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SockJS xhr_streaming 需要即时推送
        proxy_read_timeout 300s;   # 长轮询/长连接不能沿用默认 60s
    }
}
